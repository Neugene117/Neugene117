<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="title desc">
  <title id="title">Be careful.</title>
  <desc id="desc">A masked hacker in a dark hood looks out beneath neon lights. A speech bubble says Be careful.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19182e"/><stop offset="1" stop-color="#0e2731"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#515073"/><stop offset=".45" stop-color="#24243d"/><stop offset="1" stop-color="#121a2d"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33354f"/><stop offset="1" stop-color="#171b2d"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c184ff"/><stop offset="1" stop-color="#5eeadd"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#72eadd" stop-opacity=".19"/><stop offset="1" stop-color="#72eadd" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050713" flood-opacity=".5"/></filter>
  </defs>
  <rect x="7" y="7" width="506" height="416" rx="25" fill="url(#panel)" stroke="#7d83b1" stroke-opacity=".38"/>
  <circle cx="264" cy="210" r="170" fill="url(#light)"/>
  <path d="M24 89h76M24 102h47M414 339h78M450 352h42" stroke="#8376b2" stroke-opacity=".33"/>
  <g fill="#6fe9db" opacity=".7"><circle cx="69" cy="179" r="2"/><circle cx="449" cy="157" r="1.5"/><circle cx="416" cy="258" r="2"/><circle cx="91" cy="319" r="1.5"/></g>
  <circle cx="257" cy="235" r="124" fill="#64e7db" opacity=".08" filter="url(#blur)"/>
  <!-- Hood and shoulders -->
  <path d="M119 376c10-65 47-104 94-124l-23-95c-8-39 9-83 43-101 25-14 64-12 89 8 31 25 38 62 29 98l-20 92c53 22 90 60 101 122H119Z" fill="url(#hood)" stroke="#77749c" stroke-opacity=".65" stroke-width="2" filter="url(#shadow)"/>
  <path d="M156 371c17-41 46-65 82-82l-6 87h-76Zm202 0c-17-41-46-65-82-82l6 87h76Z" fill="#111929" opacity=".88"/>
  <!-- Face opening -->
  <path d="M187 174c1-56 28-94 68-100 43 7 71 44 71 100 0 31-9 57-23 75l-47 24-47-24c-15-19-23-44-22-75Z" fill="#c18e80"/>
  <path d="M181 162c7-49 33-84 75-93 44 9 71 45 76 94l-23-17-14-31-30 18-31-17-30 35-23 11Z" fill="#191a2c"/>
  <!-- Eyes and mask -->
  <path d="M190 183c14-17 31-21 50-12l-15 17-25 5Zm114 0c-14-17-31-21-50-12l15 17 25 5Z" fill="#111a29"/>
  <path d="m213 182 19-5-12 7-9-2Zm68 0-19-5 12 7 9-2Z" fill="#78f5e6"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></path>
  <path d="M185 204c25-9 47-10 71-7 23-3 46-2 71 7l-12 59-59 25-60-25-11-59Z" fill="url(#mask)" stroke="#777d9c" stroke-opacity=".7" stroke-width="1.5"/>
  <path d="m206 221 20 16m72-16-20 16M231 244h49M240 256h31" stroke="#a1a2be" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>
  <path d="M187 160c-20 34-21 84-8 115m173-115c20 34 21 84 8 115" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75"/>
  <path d="M142 347h-17m17 9h-10m258-9h17m-17 9h10" stroke="#72eadd" stroke-opacity=".5" stroke-linecap="round"/>
  <!-- Message bubble -->
  <g filter="url(#shadow)">
    <path d="M320 43h155a16 16 0 0 1 16 16v48a16 16 0 0 1-16 16h-66l-21 18 5-18h-73a16 16 0 0 1-16-16V59a16 16 0 0 1 16-16Z" fill="#f4f2ff"/>
    <path d="M340 58h4v36h-4z" fill="#9b69e8"/>
    <text x="355" y="83" fill="#24233d" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Be careful.</text>
    <text x="355" y="101" fill="#77738f" font-family="Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.6">A FRIENDLY REMINDER</text>
  </g>
  <!-- Tiny scanning sweep -->
  <path d="M72 385H448" stroke="#6fe9db" stroke-opacity=".12"/>
  <path d="M182 385h92" stroke="url(#neon)" stroke-width="2" stroke-linecap="round"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></path>
</svg>
