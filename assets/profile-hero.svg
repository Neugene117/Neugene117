    <text x="689" y="610" fill="#41d9e4" font-size="13">GitHub</text><text x="880" y="610" fill="#edf1fa" font-size="14">github.com/Neugene117</text>
    <text x="689" y="638" fill="#41d9e4" font-size="13">Email</text><text x="880" y="638" fill="#edf1fa" font-size="14">nendayishimiye@gmail.com</text>
    <path d="M687 670h683" stroke="#68788d" stroke-opacity=".36" stroke-dasharray="2 5"/>
    <circle cx="694" cy="700" r="3.5" fill="#2bd5ad"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="707" y="704" fill="#8ea0b7" font-size="12">PROFILE  /  READY</text>
    <text x="1366" y="704" text-anchor="end" fill="#66778b" font-size="11">EUGENE · 001</text>
  </g>

  <!-- Slow terminal scanline glides across both panes. -->
  <g clip-path="url(#outer)" pointer-events="none">
    <rect x="12" y="-6" width="1416" height="2" fill="#52dce7" opacity=".28" filter="url(#glow)"><animate attributeName="y" values="110;760;110" dur="11s" repeatCount="indefinite"/></rect>
