<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">EUGENE PRO — software engineer and web developer</title>
  <desc id="desc">A neon portrait framed by falling code and smooth glowing electron trails, with the name EUGENE PRO.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101326"/><stop offset=".53" stop-color="#171632"/><stop offset="1" stop-color="#092a32"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bd83ff"/><stop offset=".5" stop-color="#63e5df"/><stop offset="1" stop-color="#a7f06b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#272747"/><stop offset="1" stop-color="#102c35"/>
    </linearGradient>
    <radialGradient id="aura"><stop stop-color="#7860bb" stop-opacity=".4"/><stop offset="1" stop-color="#7860bb" stop-opacity="0"/></radialGradient>
    <radialGradient id="portraitGlow"><stop stop-color="#70e7dc" stop-opacity=".29"/><stop offset="1" stop-color="#70e7dc" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#9cebe1" stroke-opacity=".08"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="electronGlow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1440" height="520" rx="28"/></clipPath>
    <clipPath id="portraitClip"><rect x="925" y="68" width="340" height="378" rx="170"/></clipPath>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="28" fill="url(#grid)"/>
  <ellipse cx="1067" cy="227" rx="390" ry="300" fill="url(#aura)">
    <animate attributeName="opacity" values=".7;1;.7" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="360;405;360" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="1094" cy="218" r="172" fill="url(#portraitGlow)" filter="url(#soft)">
    <animate attributeName="opacity" values=".55;.92;.55" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Falling code, kept low contrast behind the headline and portrait. -->
  <g fill="#75e9d9" opacity=".2" font-family="Consolas,monospace" font-size="14">
    <g transform="translate(120 -470)"><text x="0" y="0">01<tspan x="0" y="34">{ }</tspan><tspan x="0" y="68">&lt;/&gt;</tspan><tspan x="0" y="102">10</tspan><tspan x="0" y="136">=&gt;</tspan><tspan x="0" y="170">01</tspan><tspan x="0" y="204">{ }</tspan><tspan x="0" y="238">101</tspan><tspan x="0" y="272">&lt;/&gt;</tspan><tspan x="0" y="306">010</tspan><tspan x="0" y="340">{ }</tspan><tspan x="0" y="374">10</tspan><tspan x="0" y="408">=&gt;</tspan><tspan x="0" y="442">01</tspan><tspan x="0" y="476">{ }</tspan><tspan x="0" y="510">101</tspan><tspan x="0" y="544">&lt;/&gt;</tspan><tspan x="0" y="578">01</tspan><tspan x="0" y="612">{ }</tspan><tspan x="0" y="646">10</tspan><tspan x="0" y="680">01</tspan><tspan x="0" y="714">&lt;/&gt;</tspan><tspan x="0" y="748">{ }</tspan><tspan x="0" y="782">10</tspan><tspan x="0" y="816">01</tspan></text><animateTransform attributeName="transform" type="translate" values="120 -470;120 0" dur="10s" repeatCount="indefinite"/></g>
    <g transform="translate(246 -270)" opacity=".7"><text x="0" y="0">&lt;/&gt;<tspan x="0" y="34">10</tspan><tspan x="0" y="68">{ }</tspan><tspan x="0" y="102">011</tspan><tspan x="0" y="136">=&gt;</tspan><tspan x="0" y="170">10</tspan><tspan x="0" y="204">&lt;/&gt;</tspan><tspan x="0" y="238">01</tspan><tspan x="0" y="272">{ }</tspan><tspan x="0" y="306">10</tspan><tspan x="0" y="340">&lt;/&gt;</tspan><tspan x="0" y="374">01</tspan><tspan x="0" y="408">=&gt;</tspan><tspan x="0" y="442">10</tspan><tspan x="0" y="476">{ }</tspan><tspan x="0" y="510">011</tspan><tspan x="0" y="544">&lt;/&gt;</tspan><tspan x="0" y="578">01</tspan><tspan x="0" y="612">10</tspan><tspan x="0" y="646">{ }</tspan><tspan x="0" y="680">=&gt;</tspan><tspan x="0" y="714">01</tspan><tspan x="0" y="748">10</tspan></text><animateTransform attributeName="transform" type="translate" values="246 -270;246 0" dur="8s" begin="-3s" repeatCount="indefinite"/></g>
    <g transform="translate(392 -560)" opacity=".55"><text x="0" y="0">{ }<tspan x="0" y="34">01</tspan><tspan x="0" y="68">&lt;/&gt;</tspan><tspan x="0" y="102">10</tspan><tspan x="0" y="136">=&gt;</tspan><tspan x="0" y="170">01</tspan><tspan x="0" y="204">{ }</tspan><tspan x="0" y="238">101</tspan><tspan x="0" y="272">10</tspan><tspan x="0" y="306">&lt;/&gt;</tspan><tspan x="0" y="340">01</tspan><tspan x="0" y="374">{ }</tspan><tspan x="0" y="408">10</tspan><tspan x="0" y="442">01</tspan><tspan x="0" y="476">&lt;/&gt;</tspan><tspan x="0" y="510">{ }</tspan><tspan x="0" y="544">10</tspan><tspan x="0" y="578">01</tspan><tspan x="0" y="612">=&gt;</tspan><tspan x="0" y="646">{ }</tspan><tspan x="0" y="680">10</tspan><tspan x="0" y="714">01</tspan></text><animateTransform attributeName="transform" type="translate" values="392 -560;392 0" dur="11s" begin="-6s" repeatCount="indefinite"/></g>
    <g transform="translate(540 -350)" opacity=".65"><text x="0" y="0">10<tspan x="0" y="34">&lt;/&gt;</tspan><tspan x="0" y="68">01</tspan><tspan x="0" y="102">{ }</tspan><tspan x="0" y="136">=&gt;</tspan><tspan x="0" y="170">10</tspan><tspan x="0" y="204">01</tspan><tspan x="0" y="238">&lt;/&gt;</tspan><tspan x="0" y="272">{ }</tspan><tspan x="0" y="306">10</tspan><tspan x="0" y="340">01</tspan><tspan x="0" y="374">=&gt;</tspan><tspan x="0" y="408">&lt;/&gt;</tspan><tspan x="0" y="442">10</tspan><tspan x="0" y="476">{ }</tspan><tspan x="0" y="510">01</tspan><tspan x="0" y="544">10</tspan><tspan x="0" y="578">&lt;/&gt;</tspan><tspan x="0" y="612">{ }</tspan><tspan x="0" y="646">01</tspan><tspan x="0" y="680">10</tspan><tspan x="0" y="714">=&gt;</tspan><tspan x="0" y="748">01</tspan></text><animateTransform attributeName="transform" type="translate" values="540 -350;540 0" dur="9s" begin="-1.5s" repeatCount="indefinite"/></g>
    <g transform="translate(1365 -500)" opacity=".56"><text x="0" y="0">&lt;/&gt;<tspan x="0" y="34">{ }</tspan><tspan x="0" y="68">01</tspan><tspan x="0" y="102">10</tspan><tspan x="0" y="136">=&gt;</tspan><tspan x="0" y="170">&lt;/&gt;</tspan><tspan x="0" y="204">01</tspan><tspan x="0" y="238">10</tspan><tspan x="0" y="272">{ }</tspan><tspan x="0" y="306">=&gt;</tspan><tspan x="0" y="340">01</tspan><tspan x="0" y="374">10</tspan><tspan x="0" y="408">&lt;/&gt;</tspan><tspan x="0" y="442">{ }</tspan><tspan x="0" y="476">01</tspan><tspan x="0" y="510">10</tspan><tspan x="0" y="544">=&gt;</tspan><tspan x="0" y="578">{ }</tspan><tspan x="0" y="612">01</tspan><tspan x="0" y="646">&lt;/&gt;</tspan><tspan x="0" y="680">10</tspan><tspan x="0" y="714">{ }</tspan></text><animateTransform attributeName="transform" type="translate" values="1365 -500;1365 0" dur="12s" begin="-5s" repeatCount="indefinite"/></g>
  </g>

  <!-- Quiet frame and horizon keep the scene structured. -->
  <path d="M0 452 158 418l130 23 148-67 142 28 145-83 121 31 145-99 130 22 141-73 180 38v302H0Z" fill="#101326" opacity=".48"/>
  <path d="M0 455 158 421l130 23 148-67 142 28 145-83 121 31 145-99 130 22 141-73 180 38" fill="none" stroke="url(#neon)" stroke-opacity=".24" stroke-width="2"/>

  <!-- Smooth electron trails converge on the portrait. -->
  <g fill="none" stroke-linecap="round">
    <path d="M590 93C724 83 799 122 961 173" stroke="#b28aff" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="4 9"/>
    <path d="M650 418C786 426 843 354 953 304" stroke="#72ece0" stroke-opacity=".19" stroke-width="1.5" stroke-dasharray="3 10"/>
    <path d="M785 229C843 215 888 211 957 218" stroke="#9ee9b4" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="2 9"/>
  </g>
  <g filter="url(#electronGlow)">
    <circle r="3.3" fill="#d7b4ff"><animateMotion dur="5.2s" repeatCount="indefinite" path="M590 93C724 83 799 122 961 173"/><animate attributeName="opacity" values="0;.9;1;.75;0" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle r="2.8" fill="#71f5e4"><animateMotion dur="4.6s" begin="-2s" repeatCount="indefinite" path="M650 418C786 426 843 354 953 304"/><animate attributeName="opacity" values="0;.9;1;.72;0" dur="4.6s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle r="2.5" fill="#c3fa9d"><animateMotion dur="4s" begin="-1s" repeatCount="indefinite" path="M785 229C843 215 888 211 957 218"/><animate attributeName="opacity" values="0;.9;1;.7;0" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Portrait focal point. -->
  <g clip-path="url(#portraitClip)">
    <rect x="925" y="68" width="340" height="378" fill="url(#card)"/>
    <circle cx="1095" cy="209" r="180" fill="url(#portraitGlow)"/>
    <path d="M935 394c16-80 72-120 160-120s145 40 160 120v68H935Z" fill="#20233b"/>
    <path d="M1004 210c0-71 36-113 92-113 55 0 91 42 91 113 0 70-38 123-91 123s-92-53-92-123Z" fill="#c89282"/>
    <path d="M992 204c4-80 39-129 104-129 62 0 99 47 103 129l-23-35-22-53-45 26-47-29-45 66-25 25Z" fill="#19192d"/>
    <path d="M1010 218c18-18 40-21 61-10l-17 15-33 4Zm121 0c-18-18-40-21-61-10l17 15 33 4Z" fill="#1a2232"/>
    <path d="m1035 218 22-5-14 9-8-4Zm74 0-22-5 14 9 8-4Z" fill="#78f1e2"><animate attributeName="opacity" values=".55;1;.55" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M1095 229c-5 12-8 23-2 27" fill="none" stroke="#985f65" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    <path d="M1078 276c10 6 24 6 34 0" fill="none" stroke="#7d4b5d" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M974 161c-29 55-25 136 3 182m230-182c29 55 25 136-3 182" fill="none" stroke="url(#neon)" stroke-width="2.5" opacity=".86"/>
  </g>
  <rect x="925" y="68" width="340" height="378" rx="170" fill="none" stroke="url(#neon)" stroke-opacity=".68" stroke-width="2"/>
  <circle cx="1095" cy="257" r="185" fill="none" stroke="#8aece0" stroke-opacity=".24" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" from="0 1095 257" to="360 1095 257" dur="38s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1095" cy="257" r="198" fill="none" stroke="#b68dff" stroke-opacity=".16" stroke-dasharray="1 14">
    <animateTransform attributeName="transform" type="rotate" from="360 1095 257" to="0 1095 257" dur="52s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1095" cy="72" r="5" fill="#b8f898" filter="url(#electronGlow)"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="91" y="104" width="6" height="174" rx="3" fill="url(#neon)" opacity=".9"/>
    <text x="126" y="170" fill="#f8f6ff" font-size="79" font-weight="750" letter-spacing="-3">EUGENE</text>
    <text x="126" y="263" fill="url(#neon)" font-size="89" font-weight="750" letter-spacing="-3">PRO</text>
    <text x="130" y="314" fill="#c8c9dc" font-size="17" letter-spacing="2.8">SOFTWARE ENGINEER · WEB DEVELOPER</text>
    <path d="M130 350h92" stroke="url(#neon)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="230" cy="350" r="3" fill="#aaf6c1"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="130" y="385" fill="#9698b4" font-size="13" letter-spacing="2">BUILD  /  LEARN  /  REPEAT</text>
  </g>
  <g fill="#b6f3e8" opacity=".6"><circle cx="62" cy="68" r="1.6"/><circle cx="775" cy="85" r="1.5"/><circle cx="826" cy="464" r="1.7"/><circle cx="1320" cy="473" r="1.5"/></g>
  <rect x=".75" y=".75" width="1438.5" height="518.5" rx="27.25" fill="none" stroke="#8581ae" stroke-opacity=".37" stroke-width="1.5"/>
</svg>
